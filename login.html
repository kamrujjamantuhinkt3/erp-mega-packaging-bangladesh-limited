<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e1c52">
  <title>Sign in · Mega Packaging ERP</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking, so the page still opens if the internet is down -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/login.css">
  <script>
    document.documentElement.classList.add('js');
    // Safety net: never leave the page covered if login.js fails to load
    setTimeout(function () { document.body.classList.add('is-ready'); }, 8000);
  </script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</head>
<body>

  <!-- Preloader: a carton folds shut and gets taped, then the screen is cut open -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__half preloader__half--top"></div>
    <div class="preloader__half preloader__half--bottom"></div>
    <div class="preloader__seam"></div>
    <div class="preloader__content">
      <div class="carton-stage carton-stage--packing">
        <div class="carton-stage__shadow"></div>
        <div class="carton-stage__lift">
          <div class="carton">
            <div class="carton__face carton__face--back"></div>
            <div class="carton__face carton__face--left"><i class="carton__tab"></i></div>
            <div class="carton__face carton__face--right"><i class="carton__tab"></i></div>
            <div class="carton__face carton__face--bottom"></div>
            <div class="carton__face carton__face--front"><i class="carton__print"></i></div>
            <div class="carton__flap carton__flap--left"></div>
            <div class="carton__flap carton__flap--right"></div>
            <div class="carton__flap carton__flap--back"></div>
            <div class="carton__flap carton__flap--front"></div>
            <div class="carton__tape"></div>
          </div>
        </div>
      </div>
      <p class="preloader__name">Mega Packaging</p>
      <p class="preloader__sub">Bangladesh Limited</p>
      <div class="preloader__bar"><span></span></div>
    </div>
  </div>

  <main class="login">

    <section class="brand">
      <div class="brand__decor" aria-hidden="true">
        <span class="brand__glow brand__glow--cyan"></span>
        <span class="brand__glow brand__glow--amber"></span>
        <span class="brand__grid"></span>
        <span class="brand__board"></span>
      </div>

      <header class="brand__top reveal" style="--i:0">
        <img class="brand__logo" src="assets/images/logo-mark-light.png" width="612" height="359" alt="Mega Packaging logo">
        <div class="brand__wordmark">
          <strong>Mega Packaging</strong>
          <span>Bangladesh Limited</span>
        </div>
      </header>

      <div class="brand__hero">
        <div class="brand__carton reveal" style="--i:1">
          <div class="carton-stage carton-stage--hero" aria-hidden="true">
            <div class="carton-stage__shadow"></div>
            <div class="carton-stage__lift">
              <div class="carton">
                <div class="carton__face carton__face--back"></div>
                <div class="carton__face carton__face--left"><i class="carton__tab"></i></div>
                <div class="carton__face carton__face--right"><i class="carton__tab"></i></div>
                <div class="carton__face carton__face--bottom"></div>
                <div class="carton__face carton__face--front"><i class="carton__print"></i></div>
                <div class="carton__flap carton__flap--left"></div>
                <div class="carton__flap carton__flap--right"></div>
                <div class="carton__flap carton__flap--back"></div>
                <div class="carton__flap carton__flap--front"></div>
                <div class="carton__tape"></div>
              </div>
            </div>
          </div>
        </div>
        <p class="brand__eyebrow reveal" style="--i:2"><span></span>Accounts Department</p>
        <h1 class="brand__title reveal" style="--i:3">Enterprise Resource <em>Planning</em></h1>
        <p class="brand__lead reveal" style="--i:4">Secure sign-in for the accounts team of Mega Packaging Bangladesh Limited.</p>
      </div>
    </section>

    <section class="auth">
      <div class="auth__inner">
        <header class="auth__head reveal" style="--i:2">
          <h2>Welcome back</h2>
          <p>Sign in to continue to the Accounts ERP.</p>
        </header>

        <!-- Signing in is handled by assets/js/login.js, which talks to api/login.php -->
        <form class="auth__form" id="loginForm" method="post" action="api/login.php" novalidate>
          <noscript>
            <p class="alert is-visible">JavaScript is turned off in this browser. Please turn it on to sign in.</p>
          </noscript>

          <div class="alert" id="formAlert" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            <span class="alert__text"></span>
          </div>

          <div class="field reveal" style="--i:3">
            <label class="field__label" for="username">Username</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="field__input" id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="formAlert" required>
            </div>
          </div>

          <div class="field reveal" style="--i:4">
            <label class="field__label" for="password">Password</label>
            <div class="field__control">
              <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="field__input field__input--password" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" aria-describedby="formAlert" required>
              <button class="field__toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </div>

          <button class="btn-signin reveal" style="--i:5" type="submit">
            <span class="btn-signin__label">Sign in</span>
            <span class="btn-signin__icon" aria-hidden="true">
              <svg class="btn-signin__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              <span class="btn-signin__spinner"></span>
              <svg class="btn-signin__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </button>
        </form>
      </div>

      <p class="auth__foot reveal" style="--i:6">&copy; <span id="year">2026</span> Mega Packaging Bangladesh Limited</p>
    </section>

  </main>
</body>
</html>
